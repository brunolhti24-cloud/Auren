<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, monospace">
  <!-- Ventana de editor de código decorativa para la sección "Nosotros" -->
  <defs>
    <linearGradient id="ed-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100D24"/>
      <stop offset="1" stop-color="#0B0A1A"/>
    </linearGradient>
    <linearGradient id="ed-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#6C3BFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="ed-clip"><rect width="640" height="470" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#ed-clip)">
    <!-- Fondo -->
    <rect width="640" height="470" fill="url(#ed-bg)"/>

    <!-- Barra de título -->
    <rect width="640" height="40" fill="#0A0818"/>
    <circle cx="20" cy="20" r="5.5" fill="#FF5F7E"/>
    <circle cx="38" cy="20" r="5.5" fill="#FFBD5C"/>
    <circle cx="56" cy="20" r="5.5" fill="#3DDC97"/>

    <!-- Pestañas -->
    <g font-size="11.5">
      <rect x="80" y="8" width="118" height="32" rx="7" fill="#100D24"/>
      <rect x="80" y="38" width="118" height="2" fill="#100D24"/>
      <rect x="92" y="18" width="14" height="12" rx="2.5" fill="#F7DF5E"/>
      <text x="95" y="27.5" font-size="7.5" font-weight="700" fill="#1A1630">JS</text>
      <text x="113" y="28" fill="#E6E9FF">proyecto.js</text>
      <rect x="80" y="8" width="118" height="2" rx="1" fill="#8B5CF6"/>

      <text x="218" y="28" fill="#6F7499">index.html</text>
      <text x="310" y="28" fill="#6F7499">styles.css</text>
    </g>

    <!-- Ruta (breadcrumb) -->
    <text x="16" y="60" font-size="10.5" fill="#6F7499">src  ›  js  ›  <tspan fill="#A5AAC6">proyecto.js</tspan>  ›  <tspan fill="#C4B5FD">lanzarProyecto</tspan></text>

    <!-- Resaltado de línea actual (línea 15) -->
    <rect x="0" y="351" width="560" height="20" fill="#6C3BFF" fill-opacity=".13"/>
    <rect x="0" y="351" width="2.5" height="20" fill="#8B5CF6"/>

    <!-- Números de línea -->
    <g font-size="12" fill="#3F4466" text-anchor="end">
      <text x="38" y="85">1</text>
      <text x="38" y="105">2</text>
      <text x="38" y="125">3</text>
      <text x="38" y="145">4</text>
      <text x="38" y="165">5</text>
      <text x="38" y="185">6</text>
      <text x="38" y="205">7</text>
      <text x="38" y="225">8</text>
      <text x="38" y="245">9</text>
      <text x="38" y="265">10</text>
      <text x="38" y="285">11</text>
      <text x="38" y="305">12</text>
      <text x="38" y="325">13</text>
      <text x="38" y="345">14</text>
      <text x="38" y="365" fill="#C4B5FD">15</text>
      <text x="38" y="385">16</text>
      <text x="38" y="405">17</text>
      <text x="38" y="425">18</text>
    </g>

    <!-- Guías de sangría -->
    <g stroke="#262A4A" stroke-width="1">
      <line x1="58.5" y1="152" x2="58.5" y2="212"/>
      <line x1="58.5" y1="272" x2="58.5" y2="372"/>
    </g>

    <!-- Código -->
    <g font-size="12.5" xml:space="preserve" fill="#E6E9FF">
      <text x="54" y="85"><tspan fill="#B392FF">import</tspan><tspan fill="#8A90B5"> { </tspan><tspan fill="#6FC3FF">crearProyecto</tspan><tspan fill="#8A90B5"> } </tspan><tspan fill="#B392FF">from</tspan> <tspan fill="#F5A3E0">"./auren.js"</tspan><tspan fill="#8A90B5">;</tspan></text>

      <text x="54" y="125" fill="#5C6386" font-style="italic">// Datos del cliente</text>
      <text x="54" y="145"><tspan fill="#B392FF">const</tspan> <tspan fill="#E6E9FF">cliente</tspan> <tspan fill="#8A90B5">= {</tspan></text>
      <text x="70" y="165"><tspan fill="#9CC4FF">nombre</tspan><tspan fill="#8A90B5">: </tspan><tspan fill="#F5A3E0">"La Fogata"</tspan><tspan fill="#8A90B5">,</tspan></text>
      <text x="70" y="185"><tspan fill="#9CC4FF">tipo</tspan><tspan fill="#8A90B5">: </tspan><tspan fill="#F5A3E0">"sistema-web"</tspan><tspan fill="#8A90B5">,</tspan></text>
      <text x="70" y="205"><tspan fill="#9CC4FF">funciones</tspan><tspan fill="#8A90B5">: [</tspan><tspan fill="#F5A3E0">"pedidos"</tspan><tspan fill="#8A90B5">, </tspan><tspan fill="#F5A3E0">"reservas"</tspan><tspan fill="#8A90B5">, </tspan><tspan fill="#F5A3E0">"pagos"</tspan><tspan fill="#8A90B5">],</tspan></text>
      <text x="54" y="225" fill="#8A90B5">};</text>

      <text x="54" y="265"><tspan fill="#B392FF">async function</tspan> <tspan fill="#6FC3FF">lanzarProyecto</tspan><tspan fill="#8A90B5">(</tspan><tspan fill="#FFB86B">datos</tspan><tspan fill="#8A90B5">) {</tspan></text>
      <text x="70" y="285"><tspan fill="#B392FF">const</tspan> proyecto <tspan fill="#8A90B5">=</tspan> <tspan fill="#B392FF">await</tspan> <tspan fill="#6FC3FF">crearProyecto</tspan><tspan fill="#8A90B5">(</tspan><tspan fill="#FFB86B">datos</tspan><tspan fill="#8A90B5">);</tspan></text>
      <text x="70" y="305">proyecto<tspan fill="#8A90B5">.</tspan><tspan fill="#9CC4FF">diseno</tspan> <tspan fill="#8A90B5">=</tspan> <tspan fill="#F5A3E0">"moderno y responsivo"</tspan><tspan fill="#8A90B5">;</tspan></text>

      <text x="70" y="345"><tspan fill="#B392FF">await</tspan> proyecto<tspan fill="#8A90B5">.</tspan><tspan fill="#6FC3FF">probar</tspan><tspan fill="#8A90B5">({ </tspan><tspan fill="#9CC4FF">dispositivos</tspan><tspan fill="#8A90B5">: </tspan><tspan fill="#F5A3E0">"todos"</tspan><tspan fill="#8A90B5"> });</tspan></text>
      <text x="70" y="365"><tspan fill="#B392FF">return</tspan> proyecto<tspan fill="#8A90B5">.</tspan><tspan fill="#6FC3FF">publicar</tspan><tspan fill="#8A90B5">();</tspan></text>
      <text x="54" y="385" fill="#8A90B5">}</text>

      <text x="54" y="425"><tspan fill="#6FC3FF">lanzarProyecto</tspan><tspan fill="#8A90B5">(</tspan>cliente<tspan fill="#8A90B5">).</tspan><tspan fill="#6FC3FF">then</tspan><tspan fill="#8A90B5">(() =&gt; </tspan><tspan fill="#F5A3E0">"¡En línea!"</tspan><tspan fill="#8A90B5">);</tspan></text>
    </g>

    <!-- Cursor parpadeante (final de la línea 15) -->
    <rect x="276" y="354" width="2" height="15" fill="#E6E9FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Minimapa -->
    <rect x="564" y="40" width="76" height="406" fill="#0D0B1E"/>
    <rect x="568" y="340" width="68" height="44" rx="2" fill="#FFFFFF" fill-opacity=".05"/>
    <g opacity=".75">
      <rect x="572" y="72" width="10" height="2.5" rx="1" fill="#B392FF"/><rect x="584" y="72" width="22" height="2.5" rx="1" fill="#6FC3FF"/><rect x="608" y="72" width="16" height="2.5" rx="1" fill="#F5A3E0"/>
      <rect x="572" y="84" width="26" height="2.5" rx="1" fill="#5C6386"/>
      <rect x="572" y="90" width="18" height="2.5" rx="1" fill="#B392FF"/>
      <rect x="576" y="96" width="12" height="2.5" rx="1" fill="#9CC4FF"/><rect x="590" y="96" width="16" height="2.5" rx="1" fill="#F5A3E0"/>
      <rect x="576" y="102" width="8" height="2.5" rx="1" fill="#9CC4FF"/><rect x="586" y="102" width="20" height="2.5" rx="1" fill="#F5A3E0"/>
      <rect x="576" y="108" width="14" height="2.5" rx="1" fill="#9CC4FF"/><rect x="592" y="108" width="40" height="2.5" rx="1" fill="#F5A3E0"/>
      <rect x="572" y="120" width="22" height="2.5" rx="1" fill="#B392FF"/><rect x="596" y="120" width="24" height="2.5" rx="1" fill="#6FC3FF"/>
      <rect x="576" y="126" width="26" height="2.5" rx="1" fill="#B392FF"/><rect x="604" y="126" width="22" height="2.5" rx="1" fill="#6FC3FF"/>
      <rect x="576" y="132" width="20" height="2.5" rx="1" fill="#9CC4FF"/><rect x="598" y="132" width="30" height="2.5" rx="1" fill="#F5A3E0"/>
      <rect x="576" y="144" width="30" height="2.5" rx="1" fill="#6FC3FF"/><rect x="608" y="144" width="22" height="2.5" rx="1" fill="#F5A3E0"/>
      <rect x="576" y="150" width="28" height="2.5" rx="1" fill="#6FC3FF"/>
      <rect x="572" y="168" width="32" height="2.5" rx="1" fill="#6FC3FF"/><rect x="606" y="168" width="18" height="2.5" rx="1" fill="#F5A3E0"/>
    </g>

    <!-- Barra de estado -->
    <rect y="446" width="640" height="24" fill="#5B2EE8"/>
    <g font-size="10.5" fill="#EDE9FF">
      <text x="14" y="462">⎇ main</text>
      <text x="74" y="462">✓ 0  ⚠ 0</text>
      <text x="626" y="462" text-anchor="end">Ln 15, Col 30    UTF-8    JavaScript</text>
    </g>
  </g>

  <!-- Borde con brillo -->
  <rect x=".75" y=".75" width="638.5" height="468.5" rx="13.5" fill="none" stroke="url(#ed-glow)" stroke-width="1.5"/>
</svg>
